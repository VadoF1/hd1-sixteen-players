name: Release
# Push a tag like v1.2.3 (matching "version" in mod/obsidian.json) and this
# zips mod/ and publishes a GitHub release that Obsidian's update button reads.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches obsidian.json
        id: meta
        run: |
          id=$(jq -r .id mod/obsidian.json)
          ver=$(jq -r .version mod/obsidian.json)
          src=$(jq -r .source mod/obsidian.json)
          tag="${GITHUB_REF_NAME#v}"
          [ "$ver" = "$tag" ] || { echo "Tag $GITHUB_REF_NAME does not match version $ver"; exit 1; }
          [ "$src" = "https://github.com/$GITHUB_REPOSITORY" ] || { echo "source in obsidian.json is $src, expected https://github.com/$GITHUB_REPOSITORY"; exit 1; }
          echo "zip=$id-$ver.zip" >> "$GITHUB_OUTPUT"
      - name: Zip the mod
        run: cd mod && zip -r -X "../${{ steps.meta.outputs.zip }}" .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "${{ steps.meta.outputs.zip }}" --title "$GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}"
